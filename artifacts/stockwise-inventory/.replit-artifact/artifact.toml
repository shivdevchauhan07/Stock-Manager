kind = "web"
previewPath = "/"
title = "Stockwise Inventory"
description = "A beginner-friendly inventory and stock management app for tracking products, stock movements, low-stock alerts, and inventory value."
version = "1.0.0"
id = "artifacts/stockwise-inventory"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23331

[services.development]
run = "pnpm --filter @workspace/stockwise-inventory run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stockwise-inventory", "run", "build" ]
serve = "static"
publicDir = "artifacts/stockwise-inventory/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23331"
BASE_PATH = "/"


[[services]]
name = "stock-api"
paths = [ "/stock-api" ]
localPort = 8000

[services.development]
run = "uv run --project ../../ python backend/app.py"

[services.production]

[services.production.build]
args = ["uv", "sync", "--project", "."]

[services.production.run]
args = ["uv", "run", "--project", ".", "python", "artifacts/stockwise-inventory/backend/app.py"]

[services.production.run.env]
PORT = "8000"

[services.production.health.startup]
path = "/stock-api/health"
